name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: npm run check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check and test
        run: npm run check

      # The counts are printed by the spec reporter above; this writes the same
      # numbers as one explicit line, and onto the run summary.
      - name: Report pass and skip counts
        if: always()
        run: npm run test:tap && node tools/ci-summary.mjs
